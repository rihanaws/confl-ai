[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/exchange"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
rust_decimal = { version = "1.42", features = ["serde"] }
rust_decimal_macros = "1.37"
uuid = { version = "1.24", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
